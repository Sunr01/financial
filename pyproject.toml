[project]
name = "finagent"
version = "0.1.0"
description = "FinAgent - 金融投研平台：多智能体编排 + RAG + 回测 + 模拟交易"
requires-python = ">=3.10"

dependencies = [
    # ---- LangChain / LangGraph 生态 ----
    "langchain-core",
    "langchain-community",
    "langchain-milvus>=0.4.0",
    "langchain-text-splitters",
    "langchain-deepseek>=1.1.0",
    "langgraph",
    "langgraph-checkpoint-postgres>=3.0.5",
    # ---- 数据与向量化 ----
    "akshare",
    "dashscope>=1.27.0",
    "pymilvus",
    # ---- Web 服务 ----
    "fastapi",
    "uvicorn",
    # ---- 配置 ----
    "pydantic-settings",
    # ---- 认证（JWT + bcrypt）----
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    # ---- 数据库（PostgreSQL）----
    "psycopg[binary,pool]>=3.3.0",
    # ---- 图表（回测用，前端用 ECharts）----
    "matplotlib",
    "mplfinance",
    # ---- MCP 工具（天气/地图）----
    "mcp",
    "langchain-mcp-adapters>=0.1.0",
    # 注：LlamaIndex 双轨(rag/llama_rag.py)暂未接入主线,依赖已从默认依赖移除。
    # 原因:langchain-milvus>=0.4.0 要求 pymilvus>=3,而 llama-index-vector-stores-milvus
    # 元数据锁 pymilvus<3,uv 严格解析下无解(之前 Dockerfile 用 pip --no-deps 绕过,
    # 仅对 pip 有效)。待其支持 pymilvus 3 后再加回:
    #   "llama-index",
    #   "llama-index-vector-stores-milvus",
    # ---- 测试 ----
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
